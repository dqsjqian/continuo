name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Architectural invariants first: they are cheap and they fail loudest.
  discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layering and framework-independence check
        run: python3 tools/ci/check_layering.py

  # Both standards are built because Result<T> has two implementations:
  # std::expected on C++23, a documented subset on C++20. Only building one
  # would let the other rot.
  build:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        std: [20, 23]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=${{ matrix.std }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Coroutine frame lifetime is the easiest thing in this library to get
  # subtly wrong, and the hardest to notice without a sanitizer.
  sanitizers:
    needs: discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ASan + UBSan
        run: >
          cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build/asan --parallel
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/asan --output-on-failure

# Windows is intentionally absent until modules/transport lands: there is no
# platform-specific code to exercise yet, and a green job that proves nothing
# is worse than an honest gap.
