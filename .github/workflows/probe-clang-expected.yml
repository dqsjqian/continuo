name: probe-clang-expected

on:
  workflow_dispatch:

jobs:
  probe:
    name: probe clang 19/20 expected fix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install newer clangs
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 clang-20 || sudo apt-get install -y clang-19

      - name: Feature macros per compiler
        run: |
          for cxx in clang++-18 clang++-19 clang++-20 g++-14; do
            if command -v $cxx >/dev/null; then
              echo "=== $cxx ==="
              echo | $cxx -std=c++23 -x c++ -dM -E - | grep -E "__cpp_concepts|cpp_lib_expected" || echo "(none)"
            fi
          done

      - name: Compile std::expected probe per compiler
        run: |
          cat > /tmp/probe.cpp <<'EOF'
          #include <expected>
          std::expected<int, int> probe() { return 42; }
          int main() { return probe().value() - 42; }
          EOF
          for cxx in clang++-19 clang++-20 g++-14; do
            if command -v $cxx >/dev/null; then
              echo "=== $cxx ==="
              $cxx -std=c++23 /tmp/probe.cpp -o /tmp/probe && /tmp/probe && echo "OK: $cxx"
            fi
          done

      - name: Compile Continuo error.cpp with clang-19
        if: hashFiles('/usr/bin/clang++-19') != ''
        run: |
          clang++-19 -std=c++23 -O2 -Wall -Wextra -Werror \
            -Imodules/core/include -c modules/core/src/error.cpp -o /tmp/error.o && echo CONTINUO_OK_CLANG19
