name: probe-clang-expected

on:
  workflow_dispatch:

jobs:
  probe:
    name: probe clang-18 std::expected on ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-18 exactly like Aria CI
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Compiler identity
        run: |
          clang++-18 --version
          echo '--- default stdlib/header search ---'
          echo | clang++-18 -std=c++23 -x c++ -E -v - 2>&1 | grep -A6 "#include <...> search starts here" || true

      - name: Feature macros at -std=c++23
        run: |
          echo '--- all macros matching expected/cplusplus ---'
          echo | clang++-18 -std=c++23 -x c++ -dM -E - | grep -E "__cplusplus|cpp_lib_expected" || true
          echo '--- with explicit -stdlib=libstdc++ ---'
          echo | clang++-18 -std=c++23 -stdlib=libstdc++ -x c++ -dM -E - | grep -E "__cplusplus|cpp_lib_expected" || true

      - name: Try compiling std::expected
        run: |
          cat > /tmp/probe.cpp <<'EOF'
          #include <expected>
          std::expected<int, int> probe() { return 42; }
          int main() { return probe().value() - 42; }
          EOF
          echo '--- default stdlib ---'
          clang++-18 -std=c++23 /tmp/probe.cpp -o /tmp/probe && /tmp/probe && echo DEFAULT_OK
          echo '--- explicit libstdc++ ---'
          clang++-18 -std=c++23 -stdlib=libstdc++ /tmp/probe.cpp -o /tmp/probe2 && /tmp/probe2 && echo LIBSTDCXX_OK

      - name: Try compiling Continuo error.hpp with Aria's exact flag set
        run: |
          clang++-18 -std=c++23 -O3 -DNDEBUG -fPIC -fvisibility=hidden \
            -fvisibility-inlines-hidden -Wall -Wextra -Wpedantic -Wconversion \
            -Wsign-conversion -Wshadow -Wnon-virtual-dtor -Wold-style-cast -Werror \
            -Imodules/core/include -c modules/core/src/error.cpp -o /tmp/error.o \
            && echo CONTINUO_ERROR_CPP_OK
