name: probe-clang-expected

on:
  workflow_dispatch:

jobs:
  probe:
    name: probe libstdc++ expected guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-18 exactly like Aria CI
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: What toolchain packages exist
        run: |
          dpkg -l | grep -E "g\+\+-1[0-9]|libstdc\+\+-1[0-9]-dev|clang-18" || true

      - name: Inspect the <expected> header guard
        run: |
          ls -la /usr/include/c++/14/expected
          echo '--- first 40 lines ---'
          head -40 /usr/include/c++/14/expected
          echo '--- guard lines ---'
          grep -n "if __cplusplus\|ifdef\|ifndef _GLIBCXX" /usr/include/c++/14/expected | head -10

      - name: Try with g++-14 installed as well
        run: |
          sudo apt-get install -y g++-14
          echo '--- macros with g++-14 present ---'
          echo | clang++-18 -std=c++23 -x c++ -dM -E - | grep -E "__cplusplus|cpp_lib_expected" || true
          cat > /tmp/probe.cpp <<'EOF'
          #include <expected>
          std::expected<int, int> probe() { return 42; }
          int main() { return probe().value() - 42; }
          EOF
          clang++-18 -std=c++23 /tmp/probe.cpp -o /tmp/probe && /tmp/probe && echo EXPECTED_OK_WITH_GPP14
